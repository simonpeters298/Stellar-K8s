apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: contractwasms.stellar.org
spec:
  group: stellar.org
  names:
    kind: ContractWASM
    listKind: ContractWASMList
    plural: contractwasms
    singular: contractwasm
    shortNames: [cwasm]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [rpcUrl, wasmUri, wasmLedgerKeyXdr, sha256, uploadTransactionXdr]
              properties:
                rpcUrl: {type: string, format: uri}
                wasmUri: {type: string, format: uri}
                wasmLedgerKeyXdr: {type: string, minLength: 1}
                sha256: {type: string, pattern: '^[A-Fa-f0-9]{64}$'}
                uploadTransactionXdr: {type: string, minLength: 1}
            status:
              type: object
              properties:
                phase: {type: string, enum: [Pending, Submitted, Ready, Failed]}
                wasmHash: {type: string}
                transactionHash: {type: string}
                lastError: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: contractinstances.stellar.org
spec:
  group: stellar.org
  names:
    kind: ContractInstance
    listKind: ContractInstanceList
    plural: contractinstances
    singular: contractinstance
    shortNames: [cinst]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [rpcUrl, wasm, wasmHash, contractId, contractLedgerKeyXdr, deploymentTransactionXdr]
              properties:
                rpcUrl: {type: string, format: uri}
                wasm: {type: string, minLength: 1}
                wasmHash: {type: string, pattern: '^[A-Fa-f0-9]{64}$'}
                contractId: {type: string, minLength: 1}
                contractLedgerKeyXdr: {type: string, minLength: 1}
                deploymentTransactionXdr: {type: string, minLength: 1}
                storage:
                  type: array
                  items:
                    type: object
                    required: [keyXdr, valueXdr, durability, ttlLedgers, transactionXdr]
                    properties:
                      keyXdr: {type: string}
                      valueXdr: {type: string}
                      durability: {type: string, enum: [Temporary, Persistent]}
                      ttlLedgers: {type: integer, format: int32, minimum: 1}
                      transactionXdr: {type: string, minLength: 1}
            status:
              type: object
              properties:
                phase: {type: string, enum: [Pending, Submitted, Ready, Failed]}
                contractId: {type: string}
                transactionHash: {type: string}
                storageIndex: {type: integer, format: int32}
                deploymentComplete: {type: boolean}
                lastError: {type: string}