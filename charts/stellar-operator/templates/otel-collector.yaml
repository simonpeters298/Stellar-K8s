{{- if .Values.otel.collector.enabled }}
# OTel Collector — receives OTLP spans from the operator and forwards them to
# Honeycomb, Jaeger, or Grafana Tempo depending on values.yaml configuration.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stellar-operator.fullname" . }}-otel-collector
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
      # Issue #1481: stamp the contract version without rewriting valid identity.
      transform/contract:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - set(attributes["stellar.observability.contract.version"], "1.0.0") where attributes["stellar.observability.contract.version"] == nil
        metric_statements:
          - context: resource
            statements:
              - set(attributes["stellar.observability.contract.version"], "1.0.0") where attributes["stellar.observability.contract.version"] == nil
        log_statements:
          - context: resource
            statements:
              - set(attributes["stellar.observability.contract.version"], "1.0.0") where attributes["stellar.observability.contract.version"] == nil
      # Main pipeline: drop (route away) signals missing required identity.
      filter/drop_invalid:
        error_mode: ignore
        traces:
          span:
            - 'resource.attributes["service.name"] == nil or resource.attributes["service.instance.id"] == nil or resource.attributes["k8s.pod.name"] == nil or resource.attributes["k8s.namespace.name"] == nil or resource.attributes["k8s.node.name"] == nil or resource.attributes["stellar.observability.contract.version"] == nil'
        metrics:
          metric:
            - 'resource.attributes["service.name"] == nil or resource.attributes["service.instance.id"] == nil or resource.attributes["k8s.pod.name"] == nil or resource.attributes["k8s.namespace.name"] == nil or resource.attributes["k8s.node.name"] == nil or resource.attributes["stellar.observability.contract.version"] == nil'
        logs:
          log_record:
            - 'resource.attributes["service.name"] == nil or resource.attributes["service.instance.id"] == nil or resource.attributes["k8s.pod.name"] == nil or resource.attributes["k8s.namespace.name"] == nil or resource.attributes["k8s.node.name"] == nil or resource.attributes["stellar.observability.contract.version"] == nil'
      # Dead-letter pipeline: keep only violating signals (never silently drop).
      filter/keep_invalid:
        error_mode: ignore
        traces:
          span:
            - 'resource.attributes["service.name"] != nil and resource.attributes["service.instance.id"] != nil and resource.attributes["k8s.pod.name"] != nil and resource.attributes["k8s.namespace.name"] != nil and resource.attributes["k8s.node.name"] != nil and resource.attributes["stellar.observability.contract.version"] != nil'
        metrics:
          metric:
            - 'resource.attributes["service.name"] != nil and resource.attributes["service.instance.id"] != nil and resource.attributes["k8s.pod.name"] != nil and resource.attributes["k8s.namespace.name"] != nil and resource.attributes["k8s.node.name"] != nil and resource.attributes["stellar.observability.contract.version"] != nil'
        logs:
          log_record:
            - 'resource.attributes["service.name"] != nil and resource.attributes["service.instance.id"] != nil and resource.attributes["k8s.pod.name"] != nil and resource.attributes["k8s.namespace.name"] != nil and resource.attributes["k8s.node.name"] != nil and resource.attributes["stellar.observability.contract.version"] != nil'

    exporters:
      {{- if .Values.otel.collector.config.honeycomb.enabled }}
      otlp/honeycomb:
        endpoint: {{ .Values.otel.collector.config.honeycomb.endpoint | quote }}
        headers:
          x-honeycomb-team: "${HONEYCOMB_API_KEY}"
      {{- end }}
      {{- if .Values.otel.collector.config.jaeger.enabled }}
      otlp/jaeger:
        endpoint: {{ .Values.otel.collector.config.jaeger.endpoint | quote }}
        tls:
          insecure: true
      {{- end }}
      {{- if .Values.otel.collector.config.tempo.enabled }}
      otlp/tempo:
        endpoint: {{ .Values.otel.collector.config.tempo.endpoint | quote }}
        tls:
          insecure: true
      {{- end }}
      {{- if .Values.otel.collector.config.loki.enabled }}
      loki:
        endpoint: {{ .Values.otel.collector.config.loki.endpoint | quote }}
      {{- end }}
      {{- if .Values.otel.collector.config.elasticsearch.enabled }}
      elasticsearch:
        endpoints: [{{ .Values.otel.collector.config.elasticsearch.endpoint | quote }}]
        index: {{ .Values.otel.collector.config.elasticsearch.index | quote }}
      {{- end }}
      # Always include a debug exporter so the collector starts even with no
      # backend configured (useful for local development).
      debug:
        verbosity: basic
      file/deadletter:
        path: /var/lib/otel/deadletter/quarantine.json
        rotation:
          max_megabytes: 100
          max_days: 7

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/contract, filter/drop_invalid, batch]
          exporters:
            - debug
            {{- if .Values.otel.collector.config.honeycomb.enabled }}
            - otlp/honeycomb
            {{- end }}
            {{- if .Values.otel.collector.config.jaeger.enabled }}
            - otlp/jaeger
            {{- end }}
            {{- if .Values.otel.collector.config.tempo.enabled }}
            - otlp/tempo
            {{- end }}
        traces/deadletter:
          receivers: [otlp]
          processors: [transform/contract, filter/keep_invalid, batch]
          exporters:
            - file/deadletter
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, transform/contract, filter/drop_invalid, batch]
          exporters:
            - debug
        metrics/deadletter:
          receivers: [otlp]
          processors: [transform/contract, filter/keep_invalid, batch]
          exporters:
            - file/deadletter
        logs:
          receivers: [otlp]
          processors: [memory_limiter, transform/contract, filter/drop_invalid, batch]
          exporters:
            - debug
            {{- if .Values.otel.collector.config.loki.enabled }}
            - loki
            {{- end }}
            {{- if .Values.otel.collector.config.elasticsearch.enabled }}
            - elasticsearch
            {{- end }}
        logs/deadletter:
          receivers: [otlp]
          processors: [transform/contract, filter/keep_invalid, batch]
          exporters:
            - file/deadletter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stellar-operator.fullname" . }}-otel-collector
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "stellar-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        {{- include "stellar-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "stellar-operator.fullname" . }}-otel-collector
        - name: deadletter
          emptyDir: {}
      {{- if .Values.otel.collector.config.honeycomb.enabled }}
      {{- if .Values.otel.collector.config.honeycomb.apiKeySecretRef }}
      initContainers: []
      {{- end }}
      {{- end }}
      containers:
        - name: otel-collector
          image: "{{ .Values.otel.collector.image.repository }}:{{ .Values.otel.collector.image.tag }}"
          imagePullPolicy: {{ .Values.otel.collector.image.pullPolicy }}
          args: ["--config=/conf/config.yaml"]
          {{- if and .Values.otel.collector.config.honeycomb.enabled .Values.otel.collector.config.honeycomb.apiKeySecretRef }}
          env:
            - name: HONEYCOMB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otel.collector.config.honeycomb.apiKeySecretRef | quote }}
                  key: HONEYCOMB_API_KEY
          {{- end }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: deadletter
              mountPath: /var/lib/otel/deadletter
          resources:
            {{- toYaml .Values.otel.collector.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stellar-operator.fullname" . }}-otel-collector
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  type: ClusterIP
  selector:
    {{- include "stellar-operator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: metrics
      protocol: TCP
{{- end }}
