apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ledgerclosehooks.stellar.org
  annotations:
    stellar.org/issue: "1577"
    stellar.org/description: "Webhook subscriptions for Stellar ledger-close events"
spec:
  group: stellar.org
  names:
    kind: LedgerCloseWebhook
    listKind: LedgerCloseWebhookList
    plural: ledgerclosehooks
    singular: ledgerclosehook
    shortNames:
      - lchook
      - lchwh
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .spec.url
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Delivered
          type: integer
          jsonPath: .status.totalDelivered
        - name: LastSeq
          type: integer
          jsonPath: .status.lastDeliveredSequence
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >
            LedgerCloseWebhook subscribes an external HTTP endpoint to Stellar
            ledger-close events. The operator delivers a HMAC-SHA256-signed JSON
            payload to the endpoint within 5 seconds of each ledger close, with
            automatic exponential-backoff retries and delivery tracking.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - url
              properties:
                url:
                  description: >
                    Target URL that will receive POST requests with the
                    ledger-close JSON payload.
                  type: string
                  pattern: "^https?://.+"
                secretRef:
                  description: >
                    Name of a Kubernetes Secret whose `value` key holds the HMAC
                    signing secret used to compute the X-Stellar-Signature header.
                    Omit to disable payload signing.
                  type: string
                events:
                  description: >
                    Ledger-close event types to subscribe to.
                    Defaults to [LedgerClose].
                  type: array
                  items:
                    type: string
                    enum:
                      - LedgerClose
                      - LedgerLag
                      - LedgerSync
                  default:
                    - LedgerClose
                maxRetries:
                  description: >
                    Maximum number of retry attempts after the first delivery
                    failure. Retries use exponential back-off (1 s, 2 s, 4 s,
                    8 s, 16 s). Defaults to 5.
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 5
                timeoutSeconds:
                  description: >
                    HTTP request timeout in seconds for each individual attempt.
                    Defaults to 5.
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 5
                enabled:
                  description: >
                    Set to false to pause delivery without deleting the resource.
                  type: boolean
                  default: true
            status:
              type: object
              properties:
                lastDeliveredSequence:
                  description: Ledger sequence number last successfully delivered.
                  type: integer
                  format: int64
                lastDeliveredAt:
                  description: Timestamp of the last successful delivery.
                  type: string
                  format: date-time
                totalDelivered:
                  description: >
                    Cumulative count of successfully delivered ledger-close events.
                  type: integer
                  format: int64
                totalFailed:
                  description: >
                    Cumulative count of delivery failures (all retries exhausted).
                  type: integer
                  format: int64
                phase:
                  description: Phase of the most-recent delivery attempt.
                  type: string
                  enum:
                    - Pending
                    - Delivering
                    - Delivered
                    - Failed
                deliveryLog:
                  description: >
                    Ring-buffer of the 20 most-recent delivery log entries.
                  type: array
                  items:
                    type: object
                    properties:
                      ledgerSequence:
                        type: integer
                        format: int64
                      attemptedAt:
                        type: string
                        format: date-time
                      completedAt:
                        type: string
                        format: date-time
                      phase:
                        type: string
                        enum:
                          - Pending
                          - Delivering
                          - Delivered
                          - Failed
                      attempts:
                        type: integer
                      lastStatusCode:
                        type: integer
                      lastError:
                        type: string
