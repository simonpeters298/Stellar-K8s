apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: maintenanceplans.stellar.org
spec:
  group: stellar.org
  names:
    kind: MaintenancePlan
    plural: maintenanceplans
    singular: maintenanceplan
    shortNames:
      - mplan
      - mtplan
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Intent
          type: string
          jsonPath: .spec.intent
        - name: Progress
          type: string
          jsonPath: .status.progress
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: Declarative planned-maintenance orchestration (PDB-aware drain, prewarm, SLO verify, recover).
          properties:
            spec:
              type: object
              required:
                - target
              properties:
                target:
                  type: object
                  description: Nodes to maintain
                  properties:
                    nodeNames:
                      type: array
                      items:
                        type: string
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                intent:
                  type: string
                  enum: [Patch, Reboot, KernelUpdate, Evacuate]
                  default: Patch
                drain:
                  type: object
                  properties:
                    maxParallel:
                      type: integer
                      minimum: 1
                      default: 4
                    gracePeriodSeconds:
                      type: integer
                      default: 30
                    ignoreDaemonSets:
                      type: boolean
                      default: true
                    deleteEmptyDirData:
                      type: boolean
                      default: true
                pdb:
                  type: object
                  properties:
                    respect:
                      type: boolean
                      default: true
                    stallTimeoutSeconds:
                      type: integer
                      minimum: 1
                      default: 120
                    stallRecovery:
                      type: string
                      enum: [SurgeThenEvict, SkipNode, Abort]
                      default: SurgeThenEvict
                prewarm:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    readinessTimeoutSeconds:
                      type: integer
                      default: 180
                    replicaBuffer:
                      type: integer
                      default: 1
                slo:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    maxErrorRate:
                      type: number
                      minimum: 0
                      maximum: 1
                      default: 0.001
                    minAvailability:
                      type: number
                      minimum: 0
                      maximum: 1
                      default: 0.999
                    sampleWindowSeconds:
                      type: integer
                      default: 30
                abort:
                  type: object
                  properties:
                    onSloBreach:
                      type: boolean
                      default: true
                    autoRecover:
                      type: boolean
                      default: true
                    uncordonOnAbort:
                      type: boolean
                      default: true
                    requested:
                      type: boolean
                      default: false
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Planned, Prewarming, Draining, Stalled, Verifying, Aborted, Completed, Failed]
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                progress:
                  type: string
                resolvedNodes:
                  type: array
                  items:
                    type: string
                cursor:
                  type: integer
                nodesCompleted:
                  type: array
                  items:
                    type: string
                nodesFailed:
                  type: array
                  items:
                    type: string
                prewarmedWorkloads:
                  type: array
                  items:
                    type: string
                cordonedNodes:
                  type: array
                  items:
                    type: string
                pdbStalls:
                  type: integer
                lastProgressUnix:
                  type: integer
                startedUnix:
                  type: integer
                lastErrorRate:
                  type: number
                lastAvailability:
                  type: number
                coldWindowMs:
                  type: integer
                patchCycleMs:
                  type: integer
                userFacingErrors:
                  type: integer
                observedGeneration:
                  type: integer
                lastEvent:
                  type: string
                lastReconcileTime:
                  type: string
                message:
                  type: string
