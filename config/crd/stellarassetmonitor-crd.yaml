apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stellarassetmonitors.stellar.org
spec:
  group: stellar.org
  scope: Namespaced
  names:
    plural: stellarassetmonitors
    singular: stellarassetmonitor
    kind: StellarAssetMonitor
    shortNames:
      - sam
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - network
              properties:
                enabled:
                  type: boolean
                  default: true
                network:
                  type: string
                  minLength: 1
                largeSupplyChangePercent:
                  type: number
                  minimum: 0
                  default: 10
                watchList:
                  type: array
                  items:
                    type: object
                    required:
                      - assetCode
                    properties:
                      assetCode:
                        type: string
                        minLength: 1
                      issuer:
                        type: string
                      contractId:
                        type: string
            status:
              type: object