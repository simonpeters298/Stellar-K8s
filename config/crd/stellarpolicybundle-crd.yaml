apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stellarpolicybundles.stellar.org
spec:
  group: stellar.org
  names:
    categories: []
    kind: StellarPolicyBundle
    plural: stellarpolicybundles
    shortNames:
      - spb
    singular: stellarpolicybundle
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.version
          name: Version
          type: string
        - jsonPath: .status.verified
          name: Verified
          type: boolean
        - jsonPath: .status.activeHash
          name: Hash
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: StellarPolicyBundle is a signed CEL policy bundle evaluated at admission
          type: object
          properties:
            spec:
              type: object
              required:
                - version
                - policies
                - notBefore
                - notAfter
                - nonce
                - keyId
              properties:
                version:
                  type: string
                  description: Operator-independent bundle version
                policies:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - expression
                    properties:
                      name:
                        type: string
                      expression:
                        type: string
                        description: CEL expression that must evaluate to true
                notBefore:
                  type: string
                  format: date-time
                notAfter:
                  type: string
                  format: date-time
                nonce:
                  type: string
                keyId:
                  type: string
                algorithm:
                  type: string
                  default: ed25519
                signature:
                  type: string
                  description: Base64-encoded Ed25519 signature
                trustRootRef:
                  type: object
                  properties:
                    secretName:
                      type: string
                    secretKey:
                      type: string
                    kmsProvider:
                      type: string
                      enum:
                        - aws
                        - azure
                        - gcp
                        - vault
                    kmsKeyId:
                      type: string
                rollbackTarget:
                  type: string
            status:
              type: object
              properties:
                verified:
                  type: boolean
                activeHash:
                  type: string
                previousHash:
                  type: string
                activeVersion:
                  type: string
                lastError:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
