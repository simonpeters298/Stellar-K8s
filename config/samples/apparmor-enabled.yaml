# AppArmor configuration details: docs/production-security-hardening.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellar-operator-apparmor
  namespace: stellar-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-operator
      app.kubernetes.io/instance: apparmor-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellar-operator
        app.kubernetes.io/instance: apparmor-sample
      annotations:
        container.apparmor.security.beta.kubernetes.io/stellar-operator: runtime/default
    spec:
      containers:
        - name: stellar-operator
          image: ghcr.io/stellar/stellar-k8s:latest
          args:
            - run
            - --namespace=stellar-system
          env:
            - name: STELLAR_APPARMOR_ENABLED
              value: "true"