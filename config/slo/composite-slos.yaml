#
# Composite SLO definitions (epic #1524). Source of truth for
# monitoring/composite-slo-rules.yaml — regenerate with:
#   STELLAR_REGENERATE_SLO_RULES=1 cargo test --lib composite_slo
#
# Every weight change must bump `version` and append a matching entry to
# `reviews`; `cargo test` rejects unreviewed or mismatched weights.
tier1Services:
  - stellar-api

composites:
  - service: stellar-api
    target: 0.998
    version: 1
    slis:
      - name: availability
        record: stellar:slo:api_availability:ratio
        weight: 0.5
      - name: latency
        record: stellar:slo:api_latency:ratio
        weight: 0.3
      - name: error-rate
        record: stellar:slo:api_error_rate:ratio
        weight: 0.2
    reviews:
      - version: 1
        date: "2026-09-24"
        reviewedBy: "@observability-team"
        reason: Initial weighting; availability dominates user-facing health.
        weights:
          availability: 0.5
          latency: 0.3
          error-rate: 0.2
