apiVersion: stellar.org/v1alpha1
kind: MaintenancePlan
metadata:
  name: worker-kernel-patch
  namespace: stellar
spec:
  intent: Patch
  target:
    nodeNames:
      - worker-a
      - worker-b
    matchLabels:
      stellar.org/pool: workers
  drain:
    maxParallel: 4
    gracePeriodSeconds: 45
    ignoreDaemonSets: true
  pdb:
    respect: true
    stallTimeoutSeconds: 120
    stallRecovery: SurgeThenEvict
  prewarm:
    enabled: true
    readinessTimeoutSeconds: 180
    replicaBuffer: 1
  slo:
    enabled: true
    maxErrorRate: 0.001
    minAvailability: 0.999
    sampleWindowSeconds: 30
  abort:
    onSloBreach: true
    autoRecover: true
    uncordonOnAbort: true
    requested: false
