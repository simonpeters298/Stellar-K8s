# GENERATED from config/slo/composite-slos.yaml by src/composite_slo.rs.
# Do not edit by hand. Regenerate with:
#   STELLAR_REGENERATE_SLO_RULES=1 cargo test --lib composite_slo
groups:
  - name: stellar_composite_slo_stellar_api
    interval: 1m
    rules:
      - record: stellar:slo:composite:ratio
        expr: |
          sum by (service) (0.5 * stellar:slo:api_availability:ratio{service="stellar-api"})
          + sum by (service) (0.3 * stellar:slo:api_latency:ratio{service="stellar-api"})
          + sum by (service) (0.2 * stellar:slo:api_error_rate:ratio{service="stellar-api"})
        labels:
          service: stellar-api
          slo: stellar-api-composite
      - record: stellar:slo:composite:ratio_rate1h
        expr: avg_over_time(stellar:slo:composite:ratio{service="stellar-api"}[1h])
        labels:
          service: stellar-api
          slo: stellar-api-composite
      - record: stellar:slo:composite:burn_rate1h
        expr: (1 - stellar:slo:composite:ratio_rate1h{service="stellar-api"}) / 0.002
        labels:
          service: stellar-api
          slo: stellar-api-composite
      - record: stellar:slo:composite:ratio_rate6h
        expr: avg_over_time(stellar:slo:composite:ratio{service="stellar-api"}[6h])
        labels:
          service: stellar-api
          slo: stellar-api-composite
      - record: stellar:slo:composite:burn_rate6h
        expr: (1 - stellar:slo:composite:ratio_rate6h{service="stellar-api"}) / 0.002
        labels:
          service: stellar-api
          slo: stellar-api-composite
      - record: stellar:slo:composite:ratio_rate1d
        expr: avg_over_time(stellar:slo:composite:ratio{service="stellar-api"}[1d])
        labels:
          service: stellar-api
          slo: stellar-api-composite
      - record: stellar:slo:composite:burn_rate1d
        expr: (1 - stellar:slo:composite:ratio_rate1d{service="stellar-api"}) / 0.002
        labels:
          service: stellar-api
          slo: stellar-api-composite
      - record: stellar:slo:composite:ratio_rate3d
        expr: avg_over_time(stellar:slo:composite:ratio{service="stellar-api"}[3d])
        labels:
          service: stellar-api
          slo: stellar-api-composite
      - record: stellar:slo:composite:burn_rate3d
        expr: (1 - stellar:slo:composite:ratio_rate3d{service="stellar-api"}) / 0.002
        labels:
          service: stellar-api
          slo: stellar-api-composite
      - record: stellar:slo:composite:ratio_rate30d
        expr: avg_over_time(stellar:slo:composite:ratio{service="stellar-api"}[30d])
        labels:
          service: stellar-api
          slo: stellar-api-composite
      - record: stellar:slo:composite:burn_rate30d
        expr: (1 - stellar:slo:composite:ratio_rate30d{service="stellar-api"}) / 0.002
        labels:
          service: stellar-api
          slo: stellar-api-composite
      - record: stellar:slo:composite:error_budget_remaining
        expr: 1 - stellar:slo:composite:burn_rate30d{service="stellar-api"}
        labels:
          service: stellar-api
          slo: stellar-api-composite
      - record: stellar:slo:composite:weights_version
        expr: vector(1)
        labels:
          service: stellar-api
          slo: stellar-api-composite
